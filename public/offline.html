<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f3a5f">
<title>Offline — Vidya Setu</title>
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:#fafaf7;color:#182430;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
  main{max-width:360px;text-align:center}
  h1{font-size:1.25rem;margin:16px 0 8px}
  p{color:#5b6b7a;line-height:1.5;margin:0 0 16px}
  button{background:#1f3a5f;color:#fff;border:0;border-radius:8px;padding:12px 20px;font-size:1rem;min-height:44px}
</style>
</head>
<body>
<main>
  <img src="/icon.svg" width="64" height="64" alt="">
  <h1>You are offline</h1>
  <p>No network right now. Pages you opened earlier still work. Your application is saved on the server, so nothing is lost. Try again when you have signal.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
